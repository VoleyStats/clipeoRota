services:
  dev:
    build: ./docker
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      # Sesión de Expo (npx expo login) persistente entre contenedores.
      - expo_state:/root/.expo
    ports:
      - "8081:8081"
    environment:
      # IP del Mac en la red local, para que Expo Go en el móvil encuentre el servidor.
      # Se rellena desde el host: REACT_NATIVE_PACKAGER_HOSTNAME=$(ipconfig getifaddr en0)
      - REACT_NATIVE_PACKAGER_HOSTNAME=${REACT_NATIVE_PACKAGER_HOSTNAME:-}
      - EXPO_NO_TELEMETRY=1
      # Alternativa a `expo login`: token de acceso de expo.dev en .env (no se sube a git).
      - EXPO_TOKEN=${EXPO_TOKEN:-}
    stdin_open: true
    tty: true
    command: npx expo start
volumes:
  node_modules:
  expo_state:
